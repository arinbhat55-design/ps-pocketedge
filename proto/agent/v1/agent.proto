syntax = "proto3";

package agent.v1;

option go_package = "github.com/ankitapaul1586-cmd/pspocketedge/internal/shared/pb/agentv1";

import "google/protobuf/timestamp.proto";

// AgentSession is the contract between a managed-node agent and the
// control plane. The agent always dials out to the control plane so it
// works behind NAT/home-network firewalls with no inbound port-forwarding.
service AgentSession {
  // Enroll is a one-shot unary call an agent makes on first startup,
  // exchanging a one-time enrollment token for a long-lived credential.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Session is the persistent bidirectional stream the agent opens after
  // enrolling. It multiplexes heartbeats/status reports (agent -> control
  // plane) and commands (control plane -> agent) over one connection.
  rpc Session(stream AgentMessage) returns (stream ControlMessage);
}

message EnrollRequest {
  string token = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string agent_version = 5;
}

message EnrollResponse {
  string server_id = 1;
  string agent_credential = 2;
}

message AgentMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    DeployStatus deploy_status = 2;
    BackupStatus backup_status = 3;
    RestoreStatus restore_status = 4;
    ContainerDetail container_detail = 5;
    ContainerOpResult container_op_result = 6;
    ImageListResult image_list_result = 7;
    ImageDetail image_detail = 8;
    ImageOpResult image_op_result = 9;
  }
}

message ControlMessage {
  oneof payload {
    DeployStackCommand deploy_stack = 1;
    Ack ack = 2;
    BackupCommand backup = 3;
    RestoreCommand restore = 4;
    InspectContainerCommand inspect_container = 5;
    ContainerActionCommand container_action = 6;
    CreateContainerCommand create_container = 7;
    RenameContainerCommand rename_container = 8;
    CloneContainerCommand clone_container = 9;
    RecreateContainerCommand recreate_container = 10;
    UpdateRestartPolicyCommand update_restart_policy = 11;
    ListImagesCommand list_images = 12;
    InspectImageCommand inspect_image = 13;
    PullImageCommand pull_image = 14;
    RemoveImageCommand remove_image = 15;
    PruneImagesCommand prune_images = 16;
  }
}

message Heartbeat {
  string server_id = 1;
  google.protobuf.Timestamp sent_at = 2;
  ResourceSnapshot resources = 3;
  repeated ContainerSummary containers = 4;
  // False means "not refreshed this tick" (see edge-device tuning's
  // container-list gating), not "genuinely zero containers running" —
  // a repeated field alone can't distinguish those two cases.
  bool containers_included = 5;
}

message ResourceSnapshot {
  double cpu_percent = 1;
  double mem_percent = 2;
  double disk_percent = 3;
}

message ContainerSummary {
  string id = 1;
  string name = 2;
  string state = 3;
  string deployment_id = 4;
  string image = 5;
  string image_id = 6;
  int64 created_unix = 7;
  string status = 8;
  repeated ContainerPort ports = 9;
  repeated ContainerNetwork networks = 10;
  repeated ContainerMount mounts = 11;
}

message ContainerPort {
  string ip = 1;
  uint32 private_port = 2;
  uint32 public_port = 3;
  string type = 4;
}

message ContainerNetwork {
  string name = 1;
  string ip_address = 2;
}

message ContainerMount {
  string type = 1;
  string name = 2;
  string source = 3;
  string destination = 4;
  bool read_write = 5;
}

message DeployStackCommand {
  string deployment_id = 1;
  string stack_name = 2;
  string compose_yaml = 3;
  map<string, string> env = 4;
}

enum DeployPhase {
  DEPLOY_PHASE_UNSPECIFIED = 0;
  DEPLOY_PHASE_PENDING = 1;
  DEPLOY_PHASE_PULLING = 2;
  DEPLOY_PHASE_CREATING = 3;
  DEPLOY_PHASE_RUNNING = 4;
  DEPLOY_PHASE_FAILED = 5;
}

message DeployStatus {
  string deployment_id = 1;
  DeployPhase phase = 2;
  string message = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Ack {
  string message_id = 1;
}

enum TaskPhase {
  TASK_PHASE_UNSPECIFIED = 0;
  TASK_PHASE_RUNNING = 1;
  TASK_PHASE_COMPLETED = 2;
  TASK_PHASE_FAILED = 3;
}

// BackupCommand tells the agent to snapshot every named volume belonging
// to deployment_id into a single tar stream and PUT it to upload_url.
// Bulk bytes deliberately don't travel over the AgentSession stream
// itself (see internal/controlplane/backup's doc comment) — upload_url
// is a separate authenticated HTTP endpoint so a large transfer can't
// starve heartbeats/other commands sharing this stream's one outbound
// channel.
message BackupCommand {
  string backup_id = 1;
  string deployment_id = 2;
  string upload_url = 3;
}

message BackupStatus {
  string backup_id = 1;
  TaskPhase phase = 2;
  string message = 3;
  int64 size_bytes = 4;
}

// RestoreCommand tells the agent to GET a tar snapshot from download_url,
// extract it back into deployment_id's named volumes, then redeploy
// (stack_name/compose_yaml/env are included because the agent doesn't
// cache the original DeployStackCommand — this is what makes restore
// bring the containers back up on top of the restored data rather than
// just leaving the volumes populated with nothing running).
message RestoreCommand {
  string backup_id = 1;
  string deployment_id = 2;
  string download_url = 3;
  string stack_name = 4;
  string compose_yaml = 5;
  map<string, string> env = 6;
}

// RestoreStatus covers only the download+extract step. Once that
// completes, the agent immediately re-runs the normal deploy pipeline
// (internal/agent/docker.Deploy) on top of the restored volumes, which
// reports its own DeployStatus events through the existing path — so a
// restore's "containers coming back up" progress reuses deployment_events
// rather than this message needing to duplicate it.
message RestoreStatus {
  string backup_id = 1;
  string deployment_id = 2;
  TaskPhase phase = 3;
  string message = 4;
}

// InspectContainerCommand asks the agent to run a live ContainerInspect for
// one container and reply with ContainerDetail carrying request_id
// unchanged, so the control plane can correlate the async reply back to
// the HTTP request that triggered it. Deliberately not part of the
// heartbeat: ContainerInspect is a per-container round-trip, too expensive
// to run for every container on every heartbeat tick across a fleet, so
// it's only issued on demand when a user opens a container's detail view.
message InspectContainerCommand {
  string request_id = 1;
  string server_id = 2;
  string container_id = 3;
}

message ContainerDetail {
  string request_id = 1;
  string container_id = 2;
  bool found = 3;
  string error_message = 4;
  repeated string env = 5;
  string restart_policy_name = 6;
  int32 restart_policy_max_retry_count = 7;
  string health_status = 8;
  int32 health_failing_streak = 9;
  int32 restart_count = 10;
}

// ContainerAction is a lifecycle operation applied to one existing
// container, dispatched via ContainerActionCommand.
enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
  CONTAINER_ACTION_PAUSE = 4;
  CONTAINER_ACTION_RESUME = 5;
  CONTAINER_ACTION_KILL = 6; // force-kill (SIGKILL), for an unresponsive container
  CONTAINER_ACTION_REMOVE = 7;
}

message ContainerPortSpec {
  uint32 container_port = 1;
  uint32 host_port = 2;
  string protocol = 3;
}

message ContainerVolumeSpec {
  string volume_name = 1;
  string target = 2;
  bool read_only = 3;
}

// ContainerConfig is the full desired shape of a standalone container (not
// part of a deployed stack), used by both CreateContainerCommand and
// RecreateContainerCommand. Named volumes only, same as the compose deploy
// path (see docker/deploy.go's ensureVolumes doc comment on why bind
// mounts are rejected rather than silently ignored).
message ContainerConfig {
  string image = 1;
  string name = 2;
  repeated string command = 3;
  repeated string env = 4;
  repeated ContainerPortSpec ports = 5;
  repeated ContainerVolumeSpec volumes = 6;
  string restart_policy_name = 7;
  int32 restart_policy_max_retry_count = 8;
  map<string, string> labels = 9;
}

message ContainerActionCommand {
  string request_id = 1;
  string server_id = 2;
  string container_id = 3;
  ContainerAction action = 4;
  int32 timeout_seconds = 5; // graceful stop/restart timeout; 0 = agent default
  bool force = 6;            // for REMOVE: remove even if running
}

message CreateContainerCommand {
  string request_id = 1;
  string server_id = 2;
  ContainerConfig config = 3;
}

message RenameContainerCommand {
  string request_id = 1;
  string server_id = 2;
  string container_id = 3;
  string new_name = 4;
}

message CloneContainerCommand {
  string request_id = 1;
  string server_id = 2;
  string container_id = 3;
  string new_name = 4;
}

message RecreateContainerCommand {
  string request_id = 1;
  string server_id = 2;
  string container_id = 3;
  ContainerConfig config = 4;
}

message UpdateRestartPolicyCommand {
  string request_id = 1;
  string server_id = 2;
  string container_id = 3;
  string restart_policy_name = 4;
  int32 restart_policy_max_retry_count = 5;
}

// ContainerOpResult answers ContainerActionCommand, CreateContainerCommand,
// RenameContainerCommand, CloneContainerCommand, RecreateContainerCommand,
// and UpdateRestartPolicyCommand alike, correlated back to the request via
// request_id — same one-request/one-reply correlation InspectWaiter
// already does for InspectContainerCommand/ContainerDetail. container_id
// is the newly created container's id for CreateContainer/CloneContainer/
// RecreateContainer, and the acted-on container's id otherwise.
message ContainerOpResult {
  string request_id = 1;
  bool success = 2;
  string error_message = 3;
  string container_id = 4;
}

// ImageSummary is a snapshot of one locally-present image, from the same
// ImageList call as Docker's `docker images` — cheap enough for the
// on-demand list, unlike ImageDetail's per-image ImageInspect (see below).
message ImageSummary {
  string id = 1;
  repeated string repo_tags = 2;
  repeated string repo_digests = 3;
  int64 size_bytes = 4;
  int64 created_unix = 5;
  // Dangling means repo_tags is empty (an untagged, superseded layer) —
  // computed by the agent so the dashboard doesn't need to reimplement
  // Docker's own definition of "dangling".
  bool dangling = 6;
  int64 containers_count = 7;
}

// ListImagesCommand asks the agent for its current local image inventory.
// Unlike ContainerSummary, this is deliberately not part of Heartbeat: the
// Images tab is visited far less often than the live container view, so an
// on-demand round trip (same reasoning as InspectContainerCommand) avoids
// bloating every heartbeat with a list that's usually not being watched.
message ListImagesCommand {
  string request_id = 1;
  string server_id = 2;
}

message ImageListResult {
  string request_id = 1;
  repeated ImageSummary images = 2;
}

// InspectImageCommand asks for one image's full detail (layers, env,
// labels, architecture) via ImageInspect — too expensive to run for every
// image on every list request, so it's fetched only when a user opens an
// image's detail view, same split as InspectContainerCommand/ContainerDetail.
message InspectImageCommand {
  string request_id = 1;
  string server_id = 2;
  string image_id = 3;
}

message ImageLayer {
  string digest = 1;
  int64 size_bytes = 2;
}

message ImageDetail {
  string request_id = 1;
  bool found = 2;
  string error_message = 3;
  string id = 4;
  repeated string repo_tags = 5;
  repeated string repo_digests = 6;
  int64 size_bytes = 7;
  int64 created_unix = 8;
  string architecture = 9;
  string os = 10;
  repeated ImageLayer layers = 11;
  repeated string env = 12;
  map<string, string> labels = 13;
}

// RegistryAuth carries credentials for a PullImageCommand against a private
// registry; unset (both fields empty) means an anonymous/public pull.
message RegistryAuth {
  string username = 1;
  string password = 2;
}

message PullImageCommand {
  string request_id = 1;
  string server_id = 2;
  string image_ref = 3;
  RegistryAuth auth = 4;
}

message RemoveImageCommand {
  string request_id = 1;
  string server_id = 2;
  string image_id = 3;
  bool force = 4;
}

message PruneImagesCommand {
  string request_id = 1;
  string server_id = 2;
  // all=false removes only dangling images (docker image prune);
  // all=true also removes any image not referenced by a container
  // (docker image prune -a).
  bool all = 3;
}

// ImageOpResult answers PullImageCommand, RemoveImageCommand, and
// PruneImagesCommand alike, correlated via request_id — same one-request/
// one-reply pattern ContainerOpResult already uses for container ops.
// reclaimed_bytes is only meaningful for PruneImagesCommand.
message ImageOpResult {
  string request_id = 1;
  bool success = 2;
  string error_message = 3;
  string image_id = 4;
  int64 reclaimed_bytes = 5;
}
