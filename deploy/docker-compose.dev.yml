services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pspocketedge
      POSTGRES_PASSWORD: pspocketedge
      POSTGRES_DB: pspocketedge
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pspocketedge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
